<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>Pokemon Card Dashboard</title>
    <!-- UI theme (Vapor Vault): NIGHT VAPOR PERMANENTLY (owner decision,
         Oct 13, 2026 — supersedes the old Auto-only ruling; Day Vapor is
         retired). Resolve BEFORE first paint so the page never flashes
         the wrong theme: data-ui-theme is forced to "dark" regardless of
         the OS prefers-color-scheme, and any previously persisted
         "v2-ui-theme" preference is cleared and ignored. The town's own
         time-of-day clock still runs as art underneath. -->
    <script>
      (function () {
        try {
          window.localStorage.removeItem("v2-ui-theme");
        } catch (e) { /* private mode */ }
        document.documentElement.dataset.uiTheme = "dark";
        document.documentElement.style.colorScheme = "dark";
      })();
    </script>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="pokemon-card-dashboard"
    ></div>
  </body>
</html>
